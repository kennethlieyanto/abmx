name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check version sources and lockfile
        run: |
          cargo metadata --locked --no-deps --format-version=1 > /dev/null
          version=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "abmx") | .version')
          test "$(tr -d '[:space:]' < version.txt)" = "$version"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q --bin abmx -- parser check -v --parsers examples/parsers

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the install script
        run: |
          shellcheck website/public/install.sh
          sh -n website/public/install.sh

  actual-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/abmx-actual/helper/package-lock.json
      - name: Install the pinned Actual client
        working-directory: crates/abmx-actual/helper
        run: npm ci
      - name: Helper protocol tests
        working-directory: crates/abmx-actual/helper
        run: node --test test/*.test.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Process transport against the real helper
        run: cargo test -p abmx-actual --test process -- --ignored

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: helm lint charts/abmx -f charts/abmx/ci/minimal-values.yaml
      - name: Render the chart
        run: helm template abmx charts/abmx -f charts/abmx/ci/minimal-values.yaml > /dev/null
      - name: Lint the example config chart
        run: helm lint examples/abmx-config
      - name: Render the example config chart
        run: helm template abmx-config examples/abmx-config --namespace abmx > /dev/null
