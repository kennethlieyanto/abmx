name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target ${{ matrix.target }} -p txp
      - name: package
        run: tar -czf txp-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release txp
      - uses: actions/upload-artifact@v4
        with:
          name: txp-${{ matrix.target }}
          path: txp-*.tar.gz

  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "txp-parsers-${version}.tar.gz" parsers
      - uses: actions/upload-artifact@v4
        with:
          name: txp-parsers
          path: txp-parsers-*.tar.gz

  release:
    needs: [binary, parsers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
