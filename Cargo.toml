[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kennethlieyanto/actual-gmail-tx-sync"

[workspace.dependencies]
abmx-core = { path = "crates/abmx-core" }
abmx-tx = { path = "crates/abmx-tx" }
abmx-mail = { path = "crates/abmx-mail" }
abmx-parse = { path = "crates/abmx-parse" }
abmx-parser = { path = "crates/abmx-parser" }
abmx-gmail = { path = "crates/abmx-gmail" }
abmx-actual = { path = "crates/abmx-actual" }
abmx-file = { path = "crates/abmx-file" }
abmx-testkit = { path = "crates/abmx-testkit" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
html5ever = "0.27"
libc = "0.2"
mail-parser = "0.11"
markup5ever_rcdom = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
