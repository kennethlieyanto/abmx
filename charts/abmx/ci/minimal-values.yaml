    [fetch.gmail]
    token = "/run/secrets/abmx/gmail-credentials.json"

    [sink.file]
    path = "/data/ledger.jsonl"

    [receipts]
    prefix = "receipt/"

    [receipts.accounts]
    "test.bank" = "uuid-test"

parsers:
  existingConfigMap: abmx-parsers

gmailAuth:
  existingSecret: abmx-gmail-auth

secrets:
  existingSecret: abmx-secrets
