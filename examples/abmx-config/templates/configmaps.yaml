apiVersion: v1
kind: ConfigMap
metadata:
  name: abmx-config
  namespace: {{ .Release.Namespace }}
data:
  config.toml: |
{{ .Files.Get "files/config.toml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abmx-parsers
  namespace: {{ .Release.Namespace }}
data:
{{- range $path, $_ := .Files.Glob "files/parsers/*/config.toml" }}
  {{ base (dir $path) }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
