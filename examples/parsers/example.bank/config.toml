spec_version = 2
version = 1

[labels]
list = ["Amount", "Merchant", "Transaction Date", "Status"]

[defaults]
bank          = "example"
currency      = "USD"
tz            = "UTC"
kind          = "purchase"

[status]
label = "Status"
map   = { Successful = "settled", Failed = "failed" }

[extract.amount]
label  = "Amount"
regex  = '(?P<value>[0-9][0-9.,]*)'
number = "en"

[extract.occurred_at]
label   = "Transaction Date"
regex   = '(?P<value>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2})'
formats = ["%d %b %Y %H:%M:%S"]
locale  = "en"

[extract.counterparty]
label = "Merchant"
